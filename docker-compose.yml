version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: research_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-research_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-research_pass}
      POSTGRES_DB: ${DB_NAME:-research_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-research_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research_network

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: research_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research_network

  # Flask Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-research_user}:${DB_PASSWORD:-research_pass}@postgres:5432/${DB_NAME:-research_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/1
      - FLASK_ENV=production
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
      - ./logs:/app/logs
    ports:
      - "${WEB_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - research_network

  # Celery Worker for async tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery worker --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-research_user}:${DB_PASSWORD:-research_pass}@postgres:5432/${DB_NAME:-research_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/1
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - web
    networks:
      - research_network

  # Celery Beat for scheduled tasks
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery beat --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-research_user}:${DB_PASSWORD:-research_pass}@postgres:5432/${DB_NAME:-research_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/1
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - celery_worker
    networks:
      - research_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: research_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./app/static:/var/www/static:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - research_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  research_network:
    driver: bridge
